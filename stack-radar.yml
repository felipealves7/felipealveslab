# stack-radar.yml: the tools and approaches the Lab uses, trials and avoids.
# adopt: the default. trial: use in the next lab it fits. assess: watch, test small. hold: avoid for now.
# The Builder adds what each lab used, with its pull request as evidence. The Scout proposes ring
# moves each quarter (interests.yml cadence.stack_review); Felipe approves them with the brief's go.
reviewed: 2026-11-17

adopt:
  - name: Astro
    area: site
    evidence: every page of felipealveslab.com
  - name: Cloudflare Pages, Workers and D1
    area: hosting and live Q&A with a daily cap
    evidence: /lab/ask-the-ledger
  - name: Workers AI with Qwen models
    area: conversational BI
    evidence: Ask the Ledger benchmark, https://github.com/felipealves7/felipealveslab/pull/46
  - name: Build-time SVG charts in Astro components
    area: visuals
    evidence: /lab/aviation-reliability; /lab/spring-clock-change-road-deaths, https://github.com/felipealves7/felipealveslab/pull/57
  - name: DuckDB and dbt-core
    area: transformation and tests
    evidence: /lab/aviation-reliability
  - name: GitHub Actions and the Node test runner
    area: CI, benchmarks and tests
    evidence: every pull request; the ledger-benchmark workflow
  - name: Tableau Public
    area: companion dashboard
    evidence: https://public.tableau.com/app/profile/felipealves7/viz/BTSFlightReliability/Flightreliability
  - name: Kaggle notebooks and datasets
    area: companion analysis
    evidence: the aviation reliability notebook and dataset, linked from /lab/aviation-reliability

trial:
  - name: Plain Node pipelines with no dependencies
    area: ingestion, joins and estimates
    evidence: pipelines/dst-crashes, https://github.com/felipealves7/felipealveslab/pull/57
  - name: IANA Time Zone Database rules and computed sun position as join keys
    area: joining timestamped events to clock law and daylight
    evidence: /lab/spring-clock-change-road-deaths, https://github.com/felipealves7/felipealveslab/pull/57
  - name: Parquet files on Cloudflare R2
    area: storage for joined datasets
  - name: DuckDB-WASM
    area: in-browser SQL explorer over a lab's joined data, loaded on demand
  - name: Altair (Vega-Lite)
    area: the Lab and case-study charts, in one theme; drawn to SVG at build time and run in the browser with Vega
    evidence: the Lab pages and /case-studies/sinalvo; https://github.com/felipealves7/felipealveslab/pull/78 and https://github.com/felipealves7/felipealveslab/pull/79
  - name: BigQuery public datasets
    area: large public sources, for example GH Archive and NOAA weather
  - name: MetricFlow (the dbt Semantic Layer engine) on DuckDB
    area: governed metric definitions for Ask the Ledger and Ask this lab panels; Apache 2.0 from 0.209.0
    evidence: pipelines/semantic-layer, where 44 of 44 scoped Ask the Ledger cases match the gold answers

assess:
  - name: Mosaic
    area: linked interactive views over DuckDB
  - name: Evidence
    area: BI as code, SQL and Markdown pages
  - name: DuckLake
    area: lakehouse tables on DuckDB
  - name: dlt
    area: ingestion
  - name: rfars
    area: FARS download and harmonisation (an R package)
  - name: Claude Haiku for Ask panels
    area: conversational BI; cost estimated in https://github.com/felipealves7/felipealveslab/pull/46, accuracy not measured

hold:
  - name: A chart that needs JavaScript as a page's only visual
    area: visuals
  - name: Tableau embeds on phones
    area: visuals
