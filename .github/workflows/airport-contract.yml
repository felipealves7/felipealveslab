name: airport-contract

# Runs the airport data contract (pipelines/airport-contract) on OurAirports' files and saves every
# run, passed or failed, on the branch "airport-runs", which /lab/airport-data-contract reads.
# It never pushes to main. Runs every Monday at 03:17 UTC, after each merge that changes the
# pipeline or this file, and by hand from the Actions tab. On pull requests only the "check" job
# runs: it has a read-only token and saves nothing.
#
# run.mjs exit codes: 0 the run passed, 1 the run failed and was recorded, 2 nothing was recorded.

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'pipelines/airport-contract/**'
      - '.github/workflows/airport-contract.yml'
  pull_request:
    paths:
      - 'pipelines/airport-contract/**'
      - '.github/workflows/airport-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airport-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      exit: ${{ steps.contract.outputs.exit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start from the saved runs
        run: |
          if git fetch --quiet --depth=1 origin airport-runs 2>/dev/null; then
            git show FETCH_HEAD:results.json > data/airport-contract/results.json
            echo "Started from the runs saved on airport-runs."
          else
            echo "No airport-runs branch yet: starting from the copy on main."
          fi

      - name: Run the contract on today's files
        id: contract
        run: |
          set +e
          node pipelines/airport-contract/run.mjs
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          exit 0

      - name: Keep the output of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airport-run
          path: data/airport-contract/results.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the job when the run failed
        if: steps.contract.outputs.exit == '1'
        run: |
          echo "The contract failed. The run was recorded with its causes; see the log above."
          exit 1

  save:
    needs: check
    # Runs after a passed or a failed contract, never on pull requests, never when nothing was recorded.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.check.outputs.exit == '0' || needs.check.outputs.exit == '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # only to push the airport-runs branch; main is protected by its ruleset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: airport-run
          path: ${{ runner.temp }}/run

      - name: Save the run on the airport-runs branch
        env:
          RESULTS: ${{ runner.temp }}/run/results.json
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          summary=$(jq -r '.runs[-1] | (.runDate[0:10] + " " + .status)' "$RESULTS")
          cat > "$RUNNER_TEMP/README.md" <<'EOF'
          # airport-runs

          Saved runs of the airport data contract, written by `.github/workflows/airport-contract.yml`
          on `main`. Every run is kept, passed or failed, newest last; the latest 52 stay.
          `/lab/airport-data-contract` reads `results.json` from here.

          Source: OurAirports open data, https://ourairports.com/data/ (Public Domain, no guarantee of
          accuracy). Code and method: `pipelines/airport-contract/` and `data/airport-contract/README.md`
          on `main`.
          EOF
          parent=""
          if git ls-remote --exit-code --heads origin airport-runs > /dev/null; then
            git fetch --quiet --depth=1 origin airport-runs
            parent=$(git rev-parse FETCH_HEAD)
          fi
          # Build the commit from the two files without checking the branch out.
          readme=$(git hash-object -w "$RUNNER_TEMP/README.md")
          results=$(git hash-object -w "$RESULTS")
          tree=$(printf '100644 blob %s\tREADME.md\n100644 blob %s\tresults.json\n' "$readme" "$results" | git mktree)
          # "[CF-Pages-Skip]" first: Cloudflare Pages does not try to build this data-only branch.
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "[CF-Pages-Skip] airport run: $summary")
          git push --quiet origin "$commit:refs/heads/airport-runs"
          echo "Saved: $summary"
