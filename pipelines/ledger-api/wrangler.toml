# Worker `ledger-api`. Separate from the old `felipealveslab` Worker.
# No secrets here. If the model is switched to Claude Haiku later, Felipe adds ANTHROPIC_API_KEY
# as a Worker secret in Cloudflare and sets MODEL_PROVIDER = "anthropic".
name = "ledger-api"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[vars]
MODEL_PROVIDER = "workers-ai"

[ai]
binding = "AI"

[[d1_databases]]
binding = "LEDGER"
database_name = "ledger"
database_id = "c2d91969-dbdc-4921-bb79-fdfa1030f3c6" # shown in the Cloudflare dashboard; an id, not a secret

[[kv_namespaces]]
binding = "COUNTERS"
id = "dfe1ae03089d4f199dc253f810328731"
